[build]
  command = "npm run build"
  publish = "dist"

# 301-Weiterleitungen für Alt-URLs, die Google als 404 gemeldet hat.
# Müssen vor dem Catch-all stehen – Netlify nimmt die erste passende Regel.

[[redirects]]
  from = "/geld/kreditrechner/*"
  to = "/geld/ratenkredit-detailrechner/"
  status = 301

# unterhaltskosten-auto und wartungskosten-auto hatten hier Redirects auf den
# KM-Kostenrechner. Beide existieren jetzt als eigene Seiten – die Redirects
# sind entfallen, sonst wären die neuen Seiten nicht erreichbar.

[[redirects]]
  from = "/auto/treibstoffkosten-reise/*"
  to = "/auto/spritkosten-rechner/"
  status = 301

[[redirects]]
  from = "/auto/elektroauto-verbrennungsmotor/*"
  to = "/auto/elektroauto-tco-rechner/"
  status = 301

# Diese beiden URLs waren bisher Astro-Seiten mit einer Meta-Refresh-Weiterleitung.
# Meta-Refresh gilt bei Google als Soft-404 und vererbt keine Linkkraft – als
# echter 301 tut es beides richtig.

[[redirects]]
  from = "/auto/leasingrechner/*"
  to = "/auto/leasing-rechner/"
  status = 301

[[redirects]]
  from = "/familie/unterhalt-rechner/*"
  to = "/familie/ehegattenunterhalt-rechner/"
  status = 301

# Catch-all: muss die letzte Regel bleiben. Zeigt auf die echte 404-Seite, die
# Astro nach dist/404.html baut – vorher lieferte diese Regel den kompletten
# Startseiten-Inhalt unter jeder beliebigen URL aus, nur mit Status 404.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
