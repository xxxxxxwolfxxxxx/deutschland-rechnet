[build]
  command = "npm run build"
  publish = "dist"

# 301-Weiterleitungen für Alt-URLs, die Google als 404 gemeldet hat.
# Müssen vor dem Catch-all stehen – Netlify nimmt die erste passende Regel.

[[redirects]]
  from = "/geld/kreditrechner/*"
  to = "/geld/kreditvergleich/"
  status = 301

# Die Startseite verlinkte lange auf /geld/rentenrechner/ und
# /geld/einkommensteuer-berechnung/. Beide URLs gab es nie: Der Rentenrechner
# liegt unter familie/, der Einkommensteuer-Rechner seit 16.09.2026 unter
# geld/einkommensteuer-rechner/.

[[redirects]]
  from = "/geld/rentenrechner/*"
  to = "/familie/renten-rechner/"
  status = 301

[[redirects]]
  from = "/geld/einkommensteuer-berechnung/*"
  to = "/geld/einkommensteuer-rechner/"
  status = 301

# unterhaltskosten-auto und wartungskosten-auto hatten hier Redirects auf den
# KM-Kostenrechner. Beide existieren jetzt als eigene Seiten – die Redirects
# sind entfallen, sonst wären die neuen Seiten nicht erreichbar.

[[redirects]]
  from = "/auto/treibstoffkosten-reise/*"
  to = "/auto/spritkosten-vergleich/"
  status = 301

[[redirects]]
  from = "/auto/elektroauto-verbrennungsmotor/*"
  to = "/auto/elektroauto-tco-rechner/"
  status = 301

# Diese beiden URLs waren bisher Astro-Seiten mit einer Meta-Refresh-Weiterleitung.
# Meta-Refresh gilt bei Google als Soft-404 und vererbt keine Linkkraft – als
# echter 301 tut es beides richtig.

[[redirects]]
  from = "/auto/leasingrechner/*"
  to = "/auto/leasing-rechner/"
  status = 301

[[redirects]]
  from = "/familie/unterhalt-rechner/*"
  to = "/familie/ehegattenunterhalt-rechner/"
  status = 301

# Artikel, die von /ratgeber/ auf ihre Rechnerseite umgezogen sind. Rechner und
# Text standen vorher auf getrennten URLs; Google hat daraus zwei halbe Seiten
# gemacht – Rechnerseiten als "Gecrawlt, zurzeit nicht indexiert", Artikel mit
# null Impressionen. Die Alt-URL war indexiert und gibt ihre Linkkraft per 301
# an die zusammengelegte Seite weiter.
#
# Jeder Eintrag hier gehoert zu einem Artikel mit `aufRechnerseite: true` in
# src/data/ratgeber.ts. Beides muss zusammen gepflegt werden.

